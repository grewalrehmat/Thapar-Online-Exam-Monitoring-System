<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Dashboard</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<nav><strong>JavaLab</strong><span th:text="${user.name}"></span><form method="post" action="/logout" style="display:inline;">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button type="submit" class="nav-logout">Logout</button>
</form>
</nav>

<main>
<h1>Student Dashboard</h1>
<p class="muted">Your labs, submissions and results.</p>

<div class="grid">
<div class="card" th:each="lab : ${labs}">
    <span class="pill"
      th:text="${lab.startsAt.isAfter(T(java.time.LocalDateTime).now()) ? 'UPCOMING' : lab.status}">
</span>
    <h2 th:text="${lab.title}"></h2>
    <p class="lab-description" th:text="${lab.description}"></p>
    <p class="muted">
        <span th:text="${#temporals.format(lab.startsAt, 'dd MMM HH:mm')}"></span>
        →
        <span th:text="${#temporals.format(lab.endsAt, 'dd MMM HH:mm')}"></span>
    </p>
    <a class="button" th:href="@{/lab/{id}(id=${lab.id})}">Open Lab</a>
</div>
</div>

<h2>My submissions</h2>
<table>
<tr><th>Lab</th><th>Status</th><th>Score</th><th>Feedback</th></tr>
<tr th:each="s : ${submissions}">
<td th:text="${s.lab.title}"></td>
<td th:text="${s.status}"></td>
<td th:text="${s.score != null ? s.score + '%' : '—'}"></td>
<td th:text="${s.feedback != null ? s.feedback : '—'}"></td>
</tr>
</table>
</main>
</body>
</html>
