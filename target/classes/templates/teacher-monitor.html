<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Monitor — JavaLab</title>

<link rel="stylesheet"
      href="/css/app.css">

</head>


<body>


<nav>

    <strong>JavaLab</strong>

    <span>Teacher Monitor</span>

    <a href="/dashboard">
        Dashboard
    </a>

    <form method="post"
          action="/logout"
          style="display:inline;">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <button type="submit"
                class="nav-logout">

            Logout

        </button>

    </form>

</nav>


<main>


<h1 th:text="${lab.title}">
    Java OOP Evaluation
</h1>

<p class="muted">
    Student monitoring and evaluation
</p>


<!-- ======================================================
     STUDENTS
======================================================= -->

<div class="card">

<h2>Students</h2>

<table>

<thead>

<tr>

<th>
Student
</th>

<th>
Roll Number
</th>

<th>
Status
</th>

<th>
Score
</th>

<th>
Action
</th>

</tr>

</thead>


<tbody>

<tr th:each="student : ${students}">

<td>

<strong
    th:text="${student.name}">
    User 1
</strong>

</td>


<td
    th:text="${student.rollNumber}">
    23BCS001
</td>


<td>

<span
    th:if="${submissionByStudent.containsKey(student.id)}"
    class="pill present">

    PRESENT

</span>


<span
    th:unless="${submissionByStudent.containsKey(student.id)}"
    class="pill absent">

    ABSENT

</span>

</td>


<td>

<span
    th:if="${submissionByStudent.containsKey(student.id)}"
    th:text="${submissionByStudent.get(student.id).score != null
             ? submissionByStudent.get(student.id).score + '%'
             : 'Not graded'}">

    Not graded

</span>


<span
    th:unless="${submissionByStudent.containsKey(student.id)}">

    —

</span>

</td>


<td>

<a
    class="button"
    th:href="@{/teacher/lab/{labId}/student/{studentId}
              (labId=${lab.id},
               studentId=${student.id})}">

    View Activity

</a>

</td>

</tr>

</tbody>

</table>

</div>


<!-- ======================================================
     GLOBAL RECENT ACTIVITY
======================================================= -->

<div class="card">

<h2>
Recent Activity
</h2>

<table>

<thead>

<tr>

<th>
Student
</th>

<th>
Event
</th>

<th>
Time
</th>

<th>
Metadata
</th>

</tr>

</thead>


<tbody>

<tr th:each="a : ${activities}">

<td
    th:text="${a.student.name}">
    User 1
</td>


<td
    th:text="${a.type}">
    RUN
</td>


<td
    th:text="${#temporals.format(a.timestamp, 'HH:mm:ss')}">
    12:00:00
</td>


<td
    th:text="${a.metadata != null
              ? a.metadata
              : '—'}">

    —

</td>

</tr>


<tr th:if="${#lists.isEmpty(activities)}">

<td colspan="4">

    No activity recorded yet.

</td>

</tr>

</tbody>

</table>

</div>


</main>

</body>

</html>
