<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${lab.title + ' · JavaLab'}">Lab status · JavaLab</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header class="topbar"><a class="brand" href="/student"><span class="brand-mark small">JL</span> JavaLab</a><a class="button quiet" href="/student">← Dashboard</a></header><main class="page narrow"><p class="eyebrow">LAB STATUS</p><section class="panel status-panel"><span class="status status-neutral" th:text="${lab.status}">UPCOMING</span><h1 th:text="${lab.title}">Lab title</h1><p class="muted" th:text="${lab.course.code + ' · ' + #temporals.format(lab.scheduledDate,'dd MMM yyyy')}">UCS645 · date</p><p th:if="${lab.status.name() == 'UPCOMING'}">Your teacher has not opened this lab yet. Return when the session is active.</p><p th:if="${lab.status.name() == 'CLOSED' or lab.status.name() == 'ARCHIVED'}">This lab is closed. Your saved work remains on your dashboard.</p><div class="student-result" th:if="${submission != null and submission.score != null}"><p class="eyebrow">YOUR RESULT</p><h2 th:text="${submission.score + ' / 100'}">85 / 100</h2><p th:if="${submission.feedback != null and !submission.feedback.isEmpty()}" th:text="${submission.feedback}">Teacher feedback</p></div></section></main></body></html>
