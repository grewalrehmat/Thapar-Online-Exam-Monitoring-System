<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · JavaLab</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="auth-shell">
<main class="auth-card">
  <div class="brand-mark">JL</div><p class="eyebrow">THAPAR · PROGRAMMING LABS</p><h1>Welcome back</h1><p class="muted">Sign in to continue to JavaLab.</p>
  <div class="notice error" th:if="${param.error}">Email or password is incorrect.</div><div class="notice success" th:if="${param.logout}">You have signed out.</div>
  <form method="post" th:action="@{/login}" class="stack"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <label>Email address<input type="email" name="username" autocomplete="username" required autofocus></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="button primary full" type="submit">Sign in <span aria-hidden="true">→</span></button>
  </form><p class="footnote">Access is available on the university campus network.</p>
</main></body></html>
